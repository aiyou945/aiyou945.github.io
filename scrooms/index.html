<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The School Rooms - 主页</title>

    <link rel="stylesheet" href="./loading/1.css">
    <link rel="stylesheet" href="./loading/font1.css">
    <link rel="stylesheet" href="./loading/font2.css">

    <style>
        :root {
            --pale-gray-monochrome: 255, 251, 240;
            --gray-monochrome: 72, 69, 60;
            --black-monochrome: 25, 20, 16;
            --white-monochrome: 237, 233, 223;
            --link-color: 230, 23, 68;
            --dark-accent: 140, 136, 126;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: rgb(var(--pale-gray-monochrome));
            font-family: Inter, "Noto Sans SC", Arimo, Verdana, Geneva, sans-serif;
            color: rgb(var(--black-monochrome));
        }

        #header {
            background-color: rgb(var(--gray-monochrome));
            color: rgb(var(--white-monochrome));
            text-align: center;
            padding: 3rem 1rem;
        }
        #header h1 {
            margin: 0;
            font-size: 3rem;
            font-weight: 900;
        }
        #header h1 a {
            color: rgb(var(--white-monochrome));
            text-decoration: none;
        }
        #header h2 {
            margin: 0.5rem 0 0 0;
            font-size: 1.5rem;
            font-style: italic;
            font-weight: 400;
            color: rgb(var(--white-monochrome));
        }

        #top-bar {
            background-color: rgb(var(--gray-monochrome));
            padding: 0;
            margin: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            border-bottom: 4px solid rgb(var(--gray-monochrome));
            position: relative;
            z-index: 10;
        }

        #top-bar ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
        }
        #top-bar ul li {
            position: relative;
        }
        #top-bar ul li > a {
            display: block;
            padding: 1rem 2rem;
            color: rgb(var(--white-monochrome));
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            transition: background-color 150ms;
        }
        #top-bar ul li > a:hover {
            background-color: rgba(var(--white-monochrome), 0.1);
        }

        /* 下拉子菜单 */
        #top-bar ul li ul {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: rgb(var(--gray-monochrome));
            min-width: 100%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        #top-bar ul li:hover > ul {
            display: block;
        }
        #top-bar ul li ul li a {
            display: block;
            padding: 0.8rem 2rem;
            color: rgb(var(--white-monochrome));
            text-decoration: none;
            font-size: 1rem;
            white-space: nowrap;
            text-align: left;
        }
        #top-bar ul li ul li a:hover {
            background-color: rgba(var(--white-monochrome), 0.1);
        }

        #main-content {
            max-width: 850px;
            margin: 0 auto;
            padding: 2rem;
        }
    </style>
</head>
<body>

    <div id="header">
        <h1><a href="index.html">The School Rooms</a></h1>
        <h2>你曾经来过这里</h2>
    </div>

    <div id="top-bar">
        <ul>
            <li>
                <a href="javascript:void(0);">图书馆</a>
                <ul>
                    <li><a href="/normal-levels-i/">层级</a></li>
                    <!--<li><a href="/objects/">物品</a></li>-->
                </ul>
            </li>
        </ul>
    </div>

    <div id="main-content">
    </div>

</body>
</html>
