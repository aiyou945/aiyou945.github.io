<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 0 - "学校大门" - The School Rooms</title>
    <link rel="icon" href="../../loading/index_icon.png" type="image/png">
    <link rel="stylesheet" href="../../loading/1.css">
    <link rel="stylesheet" href="../../loading/font1.css">
    <link rel="stylesheet" href="../../loading/font2.css">
    <style>
        :root {
            --bg-dark-start: 8,8,10;
            --bg-dark-end: 26,24,22;
            --text-color: 210,205,195;
            --accent-dim: 160,140,130;
            --border-dim: 60,56,52;
        }
        body {
            background: linear-gradient(160deg, rgb(var(--bg-dark-start)), rgb(var(--bg-dark-end)));
            font-family: Inter, "Noto Sans SC", Arimo, Verdana, Geneva, sans-serif;
            margin: 0;
            padding: 0;
            color: rgb(var(--text-color));
            animation: pageFadeIn 3.2s ease-in-out;
            min-height: 100vh;
        }
        .doc-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 3em 2em;
            box-sizing: border-box;
        }
        .img-wrap{
            max-width:620px;
            margin: 5rem auto 2.5rem;
            opacity:0.88;
            filter: contrast(1.05) saturate(0.92);
        }
        .img-wrap img{
            width:100%;
            display:block;
            border-radius:4px;
            box-shadow: 0 0 40px rgba(0,0,0,0.65);
        }
        .desc-text{
            text-align:center;
            line-height:2.2;
            font-size:1.15em;
            color: rgb(var(--accent-dim));
            letter‑spacing: 0.08em;
        }
        .intro-quote {
            background-color: rgba(var(--border-dim),0.25);
            border: 1px solid rgba(var(--accent-dim),0.28);
            padding:1.4rem 1.8rem;
            margin:2rem auto;
            max-width:520px;
            text-align:center;
            font-style:italic;
            line-height:1.9;
            color: rgb(var(--text-color));
        }
        a{
            color: rgb(var(--accent-dim));
            text-decoration:none;
            opacity:0.75;
            transition: opacity 0.6s ease;
        }
        a:hover{
            opacity:1;
        }
        @keyframes pageFadeIn{
            0%{
                opacity:0;
                background: rgb(2,2,3);
            }
            45%{
                opacity:0.45;
            }
            100%{
                opacity:1;
                background: linear-gradient(160deg, rgb(var(--bg-dark-start)), rgb(var(--bg-dark-end)));
            }
        }
    </style>
</head>
<body>
<div class="doc-container">
    <div class="img-wrap">
        <img src="https://cdn.luogu.com.cn/upload/image_hosting/lu58cedz.png" alt="Level 0‑png2">
    </div>
    <div class="desc-text">
        <p>—— 你所依赖的校园</p>
        <div class="intro-quote">
            <p>你的眷恋</p>
            <p>你的归宿</p>
        </div>
        <p><a href="../">← 返回</a></p>
    </div>
</div>
</body>
</html>
