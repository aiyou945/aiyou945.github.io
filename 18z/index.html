<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>18z</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif; }
    body {
      background: linear-gradient(135deg,#f0f4fa 0%,#d9e2ef 100%);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:30px 20px; position:relative;
    }
    .container { max-width:820px; width:100%; margin:0 auto; }
    .header {
      text-align:center; padding:40px 30px 30px;
      background:rgba(255,255,255,0.70); backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px); border-radius:8px;
      box-shadow:0 12px 30px rgba(44,82,130,0.10); margin-bottom:28px;
      border:1px solid rgba(255,255,255,0.5);
    }
    .header h1 {
      font-size:2.6rem; font-weight:700;
      background:linear-gradient(145deg,#1f3a6b,#b8860b);
      -webkit-background-clip:text; background-clip:text; color:transparent;
      letter-spacing:2px; margin-bottom:6px;
    }
    .header p {
      font-size:1.2rem; color:#4a5b6e; letter-spacing:6px; font-weight:300;
      border-top:2px solid #d4c5a6; display:inline-block;
      padding:10px 12px 0;
    }
    .card {
      background:rgba(255,255,255,0.85); backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px); border-radius:8px;
      padding:32px 34px; margin-bottom:24px;
      box-shadow:0 8px 24px rgba(0,0,0,0.04),0 2px 8px rgba(44,82,130,0.06);
      border:1px solid rgba(255,255,255,0.6);
    }
    .card h2 {
      font-size:1.6rem; font-weight:600; color:#1f3a5f;
      border-left:6px solid #d4af37; padding-left:16px; margin-bottom:16px;
      display:flex; align-items:center; gap:8px;
    }
    .card h2::after { content:"✦"; color:#b8860b; font-size:1.4rem; margin-left:auto; opacity:0.4; }
    .card p { font-size:1.05rem; line-height:1.8; color:#2d3a4b; margin-bottom:18px; }
    .gray-meta { color:#7a8a9e; font-size:0.95rem; background:#f0f4fa; padding:2px 12px; border-radius:4px; display:inline-block; }
    .permission-tag { display:inline-block; font-size:0.75rem; padding:2px 14px; border-radius:30px; font-weight:500; margin-left:8px; }
    .permission-tag.member { background:#fef3e2; color:#8a6d3b; border:1px solid #d4af37; }
    .permission-tag.admin  { background:#fbe9e7; color:#b71c1c; border:1px solid #e57373; }
    .btn {
      display:inline-flex; align-items:center; justify-content:center;
      background:#1f3a6b; color:#fff; padding:10px 30px; border-radius:4px;
      text-decoration:none; font-weight:500; letter-spacing:1px; font-size:1rem;
      transition:all .2s ease; box-shadow:0 4px 12px rgba(31,58,107,0.25);
      border:1px solid rgba(255,255,255,0.15); cursor:pointer;
    }
    .btn:hover { background:#0f2a50; transform:scale(1.03); }
    .btn-disabled { background:#b0b8c5; color:#fff; cursor:not-allowed; box-shadow:none; pointer-events:none; opacity:0.6; }
    .flex-actions { display:flex; flex-wrap:wrap; align-items:center; gap:14px 20px; margin-top:6px; }
    .login-btn-area { position:fixed; top:20px; right:30px; z-index:999; display:flex; align-items:center; gap:12px; }
    .login-btn-area .btn { padding:8px 22px; font-size:0.9rem; background:#2c5282; }
    .login-btn-area .btn.logout-btn { background:#8b7a6a; }
    .user-status {
      display:inline-block; font-size:0.85rem; color:#1f3a5f;
      background:rgba(255,255,255,0.8); padding:6px 14px; border-radius:4px;
      border:1px solid #d4c5a6; white-space:nowrap;
    }
    @media (max-width:480px){
      .header h1 { font-size:2.0rem; }
      .card { padding:24px 18px; }
      .card h2 { font-size:1.3rem; }
      .login-btn-area { top:10px; right:10px; gap:6px; }
      .login-btn-area .btn { padding:6px 14px; font-size:0.8rem; }
      .user-status { font-size:0.7rem; padding:4px 10px; }
    }
  </style>
</head>
<body>
  <div class="login-btn-area" id="loginArea"></div>

  <div class="container">
    <div class="header">
      <h1>无需多言 —— sbz</h1>
      <p>仅供部分私密成员阅读，禁止传播！！</p>
    </div>

    <div class="card">
      <h2>aiyou 日记 <span class="permission-tag member" id="diaryTag">成员</span></h2>
      <p>想了很久，反正没什么人看，就把这个秘密链接放出来吧……<br>
        <span class="gray-meta">创建时间：2026-10-24 17:35:00</span></p>
      <div class="flex-actions">
        <a href="#" class="btn entry-btn" id="diaryLink">查看详情</a>
      </div>
    </div>

    <div class="card" id="adminCard">
      <h2>班级趣事 <span class="permission-tag admin" id="thingsTag">管理</span></h2>
      <p>暂无素材，欢迎投稿！<br>
        <span class="gray-meta">创建时间：2026-10-18 20:00:00</span></p>
      <div class="flex-actions">
        <a href="#" class="btn entry-btn" id="thingsLink">查看详情</a>
      </div>
    </div>
  </div>

  <script>
    var SUPABASE_URL = 'https://vrmxttqpaaodgqjlwfwq.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_IZEstYDnwdE2-EonDD_uhg_rhq314BL';
    var TOKEN_SALT = 'sbz_secret_salt_2025';

    function hashToken(username, password, dateObj) {
      var y = dateObj.getFullYear();
      var m = ('0' + (dateObj.getMonth() + 1)).slice(-2);
      var d = ('0' + dateObj.getDate()).slice(-2);
      var h = ('0' + dateObj.getHours()).slice(-2);
      var raw = y + m + d + h + username + password + TOKEN_SALT;
      var hash = 0;
      for (var i = 0; i < raw.length; i++) {
        hash = ((hash << 5) - hash) + raw.charCodeAt(i);
        hash |= 0;
      }
      return (hash >>> 0).toString(16);
    }

    function generateToken(username, password) {
      return hashToken(username, password, new Date());
    }

    function verifyToken(token, username, password) {
      if (!token || !username || !password) return false;
      var now = new Date();
      var prev = new Date(now.getTime() - 3600 * 1000);
      if (hashToken(username, password, now) === token) return true;
      if (hashToken(username, password, prev) === token) return true;
      return false;
    }

    function getLoginState() {
      var params = new URLSearchParams(window.location.search);
      var pw = params.get('pw');
      var raw = localStorage.getItem('sbz_auth');
      if (!raw) return null;
      try {
        var obj = JSON.parse(raw);
        if (!obj.username || !obj.token || !obj.psw) {
          localStorage.removeItem('sbz_auth');
          return null;
        }
        if (!pw || pw !== obj.token) {
          localStorage.removeItem('sbz_auth');
          return null;
        }
        if (!verifyToken(obj.token, obj.username, obj.psw)) {
          localStorage.removeItem('sbz_auth');
          return null;
        }
        return obj;
      } catch (e) {
        return null;
      }
    }

    function logout() {
      localStorage.removeItem('sbz_auth');
      window.location.href = window.location.pathname;
    }

    function renderByAuth() {
      var auth = getLoginState();
      var isLoggedIn = !!auth;
      var isAdmin = isLoggedIn && auth.isAdmin === true;

      var area = document.getElementById('loginArea');
      if (isLoggedIn) {
        area.innerHTML =
          '<span class="user-status">👤 ' + auth.username +
          (isAdmin ? ' 管理员' : ' 成员') + '</span>' +
          '<button class="btn logout-btn" id="logoutBtn">退出</button>';
        document.getElementById('logoutBtn').onclick = logout;
      } else {
        area.innerHTML = '<a href="./login/index.html" class="btn">登录</a>';
      }

      var diaryLink = document.getElementById('diaryLink');
      if (isLoggedIn) {
        diaryLink.href = './diaries/index.html?pw=' + encodeURIComponent(auth.token);
        diaryLink.classList.remove('btn-disabled');
        diaryLink.onclick = null;
      } else {
        diaryLink.href = '#';
        diaryLink.classList.add('btn-disabled');
        diaryLink.onclick = function (e) { e.preventDefault(); alert('请先登录后再查看成员内容'); };
      }

      var thingsLink = document.getElementById('thingsLink');
      if (isAdmin) {
        thingsLink.href = 'https://aiyou945.github.io/18z/things/?pw=' + encodeURIComponent(auth.token);
        thingsLink.classList.remove('btn-disabled');
        thingsLink.onclick = null;
      } else {
        thingsLink.href = '#';
        thingsLink.classList.add('btn-disabled');
        thingsLink.onclick = function (e) {
          e.preventDefault();
          alert(isLoggedIn ? '仅管理员可访问此页面' : '请先登录，管理员才能访问此页面');
        };
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      renderByAuth();
      document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    });

    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' ||
        (e.ctrlKey && e.key === 'u') ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J'))) {
      e.preventDefault();
      return false;
    }
  });
  </script>
</body>
</html>
