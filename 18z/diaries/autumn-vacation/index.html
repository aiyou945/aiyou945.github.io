<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>十八中 · aiyou日记</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", "PingFang SC", -apple-system, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #f0f4fa 0%, #d9e2ef 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      position: relative;
    }
    .top-right-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 99;
    }
    .container {
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }
    ul,
    ol {
      width: 100%;
      box-sizing: border-box;
      padding-left: 2em;
      margin: 0.5em 0;
    }
    li {
      overflow-wrap: anywhere;
      word-break: normal;
      white-space: normal !important;
    }
    .header {
      text-align: center;
      padding: 40px 30px 30px;
      background: rgba(255, 255, 255, 0.70);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(44, 82, 130, 0.10);
      margin-bottom: 28px;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .header h1 {
      font-size: 2.6rem;
      font-weight: 700;
      background: linear-gradient(145deg, #1f3a6b, #b8860b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 2px;
      margin-bottom: 6px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }
    .header p {
      font-size: 1.2rem;
      color: #4a5b6e;
      letter-spacing: 6px;
      font-weight: 300;
      border-top: 2px solid #d4c5a6;
      display: inline-block;
      padding-top: 10px;
      padding-left: 12px;
      padding-right: 12px;
    }
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 8px;
      padding: 32px 34px;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(44, 82, 130, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .story-title {
      font-size: 1.8rem;
      font-weight: 600;
      color: #1f3a5f;
      border-left: 6px solid #d4af37;
      padding-left: 16px;
      margin-bottom: 12px;
    }
    .story-meta {
      font-size: 0.9rem;
      color: #7a8a9e;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e8edf5;
      padding-left: 22px;
    }
    .story-content {
      font-size: 1.05rem;
      line-height: 1.9;
      color: #2d3a4b;
      margin-bottom: 24px;
    }
    .story-content p {
      margin-bottom: 14px;
    }
    .story-content a{
        text-decoration: none;
    }
    .nav-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      padding-top: 16px;
      border-top: 1px solid #e8edf5;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #1f3a6b;
      color: white;
      padding: 10px 24px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(31, 58, 107, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
    }
    .btn:hover {
      background: #0f2a50;
      transform: scale(1.03);
      box-shadow: 0 8px 20px rgba(31, 58, 107, 0.35);
    }
    .btn-outline {
      background: transparent;
      color: #1f3a6b;
      border: 2px solid #1f3a6b;
      box-shadow: none;
    }
    .btn-outline:hover {
      background: #1f3a6b;
      color: white;
    }
    .btn-disabled {
      background: #b0b8c5 !important;
      color: #fff !important;
      cursor: not-allowed !important;
      box-shadow: none !important;
      pointer-events: none !important;
      opacity: 0.6 !important;
    }
    .nav-info {
      font-size: 0.9rem;
      color: #5f6b7a;
      text-align: center;
    }
    .back-home {
      text-align: center;
      margin-top: 20px;
    }
    .loading-box {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    .loading-box .main-text {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }
    .loading-box .sub-text {
      font-size: 0.9rem;
      color: #bbb;
    }

    .private-notice {
      background: #fef7e0;
      border-left: 6px solid #e6b800;
      padding: 20px 24px;
      border-radius: 6px;
      color: #7a5c00;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0 20px;
    }
    .private-notice .icon {
      font-size: 1.8rem;
    }
    .private-notice .text {
      font-weight: 500;
    }
    .private-notice small {
      display: block;
      font-weight: 400;
      color: #a08020;
      margin-top: 4px;
      font-size: 0.85rem;
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 2.0rem;
      }
      .card {
        padding: 24px 18px;
      }
      .story-title {
        font-size: 1.4rem;
      }
      .nav-area {
        flex-direction: column;
        gap: 12px;
      }
      .btn {
        width: 100%;
        padding: 10px;
      }
      .top-right-btn .btn {
        padding: 6px 14px;
        font-size: 0.85rem;
      }
      .private-notice {
        flex-direction: column;
        text-align: center;
      }
    }
    .diary-video {
        max-width: 100%;
        width: auto;
        height: auto;
        display: block;
        border-radius: 8px;
        box-shadow: 0 6px 18px rgba(44, 82, 130, 0.12);
        border: 1px solid rgba(255,255,255,0.6);
        background: #000;
        margin: 16px 0;
        outline: none;
    }
    .diary-video::-webkit-media-controls-panel {
        background: rgba(31, 58, 107, 0.75);
    }
    .diary-video:focus {
        box-shadow: 0 0 0 3px rgba(31, 58, 107, 0.2);
    }
    .video-wrap {
        width: 100%;
        margin: 18px 0;
    }
    .video-wrap .diary-video {
        margin: 0 auto;
    }
    .video-caption {
        text-align: center;
        color: #4a5b6e;
        font-size: 0.9rem;
        margin-top: 8px;
    }

  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>日记</h1>
    <p>📖 aiyou 的日记</p>
  </div>
  <div class="card" id="storyCard">
    <div id="storyContent">
      <div class="story-content">
        <div class="story-title">挑战 10 小时速通 17 项秋假作业！</div>
        <p>书接上回《48 小时做完 56 项国庆作业》</p>
        <p><strong>视频终于上传了！上传日期：2026-11-28 11:30:00</strong></p>
        <div class="video-wrap">
          <video class="diary-video" controls preload="metadata">
            <source src="https://yourimageshare.com/ib/x3XaSpjQtj.mp4" type="video/mp4">
          </video>
          <div class="video-caption">《挑战 10 小时做完 17 项秋假作业》</div>
        </div>
      </div>
    </div>
  </div>
  <div class="back-home">
    <a href="javascript:window.close()" class="btn btn-outline" id="backHomeLink">🏠 关闭页面（java）</a>
  </div>
</div>
<script>
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' ||
        (e.ctrlKey && e.key === 'u') ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J'))) {
      e.preventDefault();
      return false;
    }
  });
</script>
</body>
</html>
