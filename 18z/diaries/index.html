<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>十八中 · aiyou日记</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", "PingFang SC", -apple-system, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #f0f4fa 0%, #d9e2ef 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      position: relative;
    }
    .top-right-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 99;
    }
    .container {
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }
    ul,
    ol {
      width: 100%;
      box-sizing: border-box;
      padding-left: 2em;
      margin: 0.5em 0;
    }
    li {
      overflow-wrap: anywhere;
      word-break: normal;
      white-space: normal !important;
    }
    .header {
      text-align: center;
      padding: 40px 30px 30px;
      background: rgba(255, 255, 255, 0.70);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(44, 82, 130, 0.10);
      margin-bottom: 28px;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .header h1 {
      font-size: 2.6rem;
      font-weight: 700;
      background: linear-gradient(145deg, #1f3a6b, #b8860b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 2px;
      margin-bottom: 6px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }
    .header p {
      font-size: 1.2rem;
      color: #4a5b6e;
      letter-spacing: 6px;
      font-weight: 300;
      border-top: 2px solid #d4c5a6;
      display: inline-block;
      padding-top: 10px;
      padding-left: 12px;
      padding-right: 12px;
    }
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 8px;
      padding: 32px 34px;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(44, 82, 130, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .story-title {
      font-size: 1.8rem;
      font-weight: 600;
      color: #1f3a5f;
      border-left: 6px solid #d4af37;
      padding-left: 16px;
      margin-bottom: 12px;
    }
    .story-meta {
      font-size: 0.9rem;
      color: #7a8a9e;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e8edf5;
      padding-left: 22px;
    }
    .story-content {
      font-size: 1.05rem;
      line-height: 1.9;
      color: #2d3a4b;
      margin-bottom: 24px;
    }
    .story-content p {
      margin-bottom: 14px;
    }
    .nav-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      padding-top: 16px;
      border-top: 1px solid #e8edf5;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #1f3a6b;
      color: white;
      padding: 10px 24px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(31, 58, 107, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
    }
    .btn:hover {
      background: #0f2a50;
      transform: scale(1.03);
      box-shadow: 0 8px 20px rgba(31, 58, 107, 0.35);
    }
    .btn-outline {
      background: transparent;
      color: #1f3a6b;
      border: 2px solid #1f3a6b;
      box-shadow: none;
    }
    .btn-outline:hover {
      background: #1f3a6b;
      color: white;
    }
    .btn-disabled {
      background: #b0b8c5 !important;
      color: #fff !important;
      cursor: not-allowed !important;
      box-shadow: none !important;
      pointer-events: none !important;
      opacity: 0.6 !important;
    }
    .nav-info {
      font-size: 0.9rem;
      color: #5f6b7a;
      text-align: center;
    }
    .back-home {
      text-align: center;
      margin-top: 20px;
    }
    .loading-box {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    .loading-box .main-text {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }
    .loading-box .sub-text {
      font-size: 0.9rem;
      color: #bbb;
    }
    @media (max-width: 480px) {
      .header h1 {
        font-size: 2.0rem;
      }
      .card {
        padding: 24px 18px;
      }
      .story-title {
        font-size: 1.4rem;
      }
      .nav-area {
        flex-direction: column;
        gap: 12px;
      }
      .btn {
        width: 100%;
        padding: 10px;
      }
      .top-right-btn .btn {
        padding:6px 14px;
        font-size:0.85rem;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>日记</h1>
    <p>📖 aiyou的日记</p>
  </div>
  <div class="card" id="storyCard">
    <div id="storyContent">
      <h3>通知</h3>
      <p>因特殊原因，本网址日记已迁移，请访问：</p>
      <p>https://aiyou945.github.io/18z/diaries-public/</p>
      <p>以查看<strong>公开部分</strong>的日记，部分日记被归为“隐藏”一类，无法通过常规手段查看。谢谢大家！</p>
    </div>
  </div>
  <div class="back-home">
    <a href="/18z/" class="btn btn-outline">🏠 返回首页</a>
  </div>
</div>
</body>
</html>
