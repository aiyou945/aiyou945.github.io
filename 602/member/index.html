<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>西峰小学六年(2)班同学回忆册</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    body {
      background: linear-gradient(145deg, #fbf3e8 0%, #f8eddb 40%, #eaf0fa 100%);
      min-height: 100vh;
      color: #2d2a24;
      padding: 20px 0;
    }
    .container {
      max-width: 1050px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .back {
      max-width: 1050px;
      margin: 20px auto 0;
      padding: 0 20px;
      text-align: center;
    }
    .back a {
      background: #2c5282;
      display: inline-block;
      width: 120px;
      height: 44px;
      text-align: center;
      line-height: 44px;
      text-decoration: none;
      border-radius: 40px;
      color: white;
      font-weight: 500;
      letter-spacing: 1px;
      box-shadow: 0 4px 10px rgba(44, 82, 130, 0.25);
      transition: all 0.25s ease;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .back a:hover {
      transform: scale(1.05);
      background: #1a3f6a;
      box-shadow: 0 8px 18px rgba(44, 82, 130, 0.35);
    }
    .header {
      text-align: center;
      padding: 40px 20px 30px;
      color: #2c5282;
      border-bottom: 3px double #dac292;
      margin-bottom: 30px;
      position: relative;
      background: rgba(255, 252, 245, 0.6);
      border-radius: 60px 60px 20px 20px;
      backdrop-filter: blur(2px);
    }
    .header h1 {
      font-size: 2.6rem;
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #1f3a5f, #b8860b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 2px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .header p {
      font-size: 1.15rem;
      color: #5f4e34;
      letter-spacing: 4px;
      font-weight: 300;
      border-top: 1px solid #e3d3b5;
      display: inline-block;
      padding-top: 8px;
    }
    .content {
      background: #fffcfa;
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06), 0 4px 10px rgba(184, 134, 11, 0.08);
      padding: 40px 35px;
      margin-bottom: 30px;
      border: 1px solid #f3e9d8;
      backdrop-filter: blur(2px);
      transition: box-shadow 0.2s;
    }
    .content h2 {
      color: #2c5282;
      border-left: 6px solid #d4af37;
      padding-left: 18px;
      margin-bottom: 28px;
      font-size: 1.7rem;
      font-weight: 600;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .content h2::after {
      content: "✦";
      color: #b8860b;
      font-size: 1.6rem;
      margin-left: auto;
      opacity: 0.5;
    }
    .content > p {
      line-height: 1.8;
      margin-bottom: 25px;
      font-size: 1.05rem;
      color: #3d3529;
      background: #f9f3e9;
      padding: 14px 20px;
      border-radius: 40px;
      border-left: 4px solid #d4af37;
    }
    .notice {
      background: #f0f4ff;
      border: 2px dashed #b6cceb;
      border-radius: 16px;
      padding: 16px 22px;
      margin-bottom: 28px;
      font-size: 1rem;
      color: #1f3a7a;
      line-height: 1.8;
    }
    .notice .qq {
      font-weight: 600;
      color: #c0392b;
      letter-spacing: 1px;
    }
    .student-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .student-item {
      display: flex;
      align-items: flex-start;
      flex-wrap: wrap;
      padding: 12px 16px;
      margin: 4px 0;
      border-radius: 16px;
      background: #fcf8f0;
      border: 1px solid #efe6d6;
      transition: background 0.15s, border-color 0.15s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.02);
      line-height: 1.6;
    }
    .student-item:hover {
      background: #fffcf3;
      border-color: #dac292;
    }
    .student-item .gender {
      display: inline-block;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 2px 10px;
      border-radius: 30px;
      margin-right: 8px;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .student-item .gender.male {
      background: #4285f4;
      color: white;
    }
    .student-item .gender.female {
      background: #ff82b2;
      color: white;
    }
    .student-item .main-info {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 10px;
    }
    .student-item .main-info strong {
      font-weight: 700;
      color: #1f3a5f;
      font-size: 1.05rem;
    }
    .student-item .main-info .name {
      font-weight: 700;
      color: #1f3a5f;
      font-size: 1.05rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      padding: 2px 10px 2px 6px;
      border-radius: 30px;
      background: #eef3fa;
      color: #1f3a5f;
      margin: 2px 4px 2px 0;
      border: 1px solid #d0dbe8;
      line-height: 1.5;
      white-space: nowrap;
    }
    .badge img {
      width: 16px;
      height: 16px;
      vertical-align: middle;
      display: inline-block;
    }
    .badge-green {
      background: #e1f3e1;
      border-color: #b6d7b6;
      color: #1d5b1d;
    }
    .badge-blue {
      background: #e2edff;
      border-color: #b6cceb;
      color: #1f3a7a;
    }
    .badge-red {
      background: #ffebeb;
      border-color: #f5c2c2;
      color: #a13d3d;
    }
    .badge-gold {
      background: #f7efd0;
      border-color: #decb94;
      color: #7d6427;
    }
    .nickname-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #e7dcc8;
      border: 2px solid #a58b68;
      padding: 0 12px 0 8px;
      border-radius: 30px;
      font-size: 0.8rem;
      margin-left: 6px;
      color: #3d2e1a;
      line-height: 1.8;
      font-weight: 500;
    }
    .nickname-tag img {
      width: 16px;
      height: 16px;
      vertical-align: middle;
      display: inline-block;
    }
    .feature-tag {
      display: inline-block;
      background: #ffedc9;
      border: 1px dashed #b8860b;
      border-radius: 30px;
      padding: 0 12px;
      font-size: 0.8rem;
      color: #5f4400;
      margin-left: 6px;
      font-style: italic;
    }
    .remark-tag {
      display: inline-block;
      background: #e8f0fe;
      border: 1px solid #b6cceb;
      border-radius: 30px;
      padding: 0 12px;
      font-size: 0.8rem;
      color: #1f3a7a;
      margin-left: 6px;
    }
    .student-item .extra-info {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 8px;
      margin-top: 4px;
      width: 100%;
    }
    .loading-box {
      text-align: center;
      padding: 30px;
      color: #999;
    }
    .loading-box .main-text {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }
    .loading-box .sub-text {
      font-size: 0.9rem;
      color: #bbb;
    }
    .loading-box .link-text {
      font-size: 0.85rem;
      color: #ccc;
      margin-top: 8px;
    }
    .loading-box .link-text a {
      color: #2c5282;
      text-decoration: underline;
      cursor: pointer;
    }
    .btn-download {
      display: inline-block;
      background: #27ae60;
      color: white;
      padding: 8px 20px;
      border-radius: 40px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      margin-top: 6px;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .btn-download:hover {
      background: #1e8449;
    }
    @media (max-width: 600px) {
      .content { padding: 20px 15px; }
      .header h1 { font-size: 1.9rem; }
      .student-item { padding: 10px 12px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>六年(2)班同学回忆册</h1>
    <p>珍藏六年时光 · 留存美好回忆</p>
  </div>

  <div class="content" id="mainContent">
    <h2>全体同学名单</h2>
    <div class="notice">
      📢 可能有漏统计的部分，欢迎纠正！也欢迎投稿更多内容！<br>
      📧 联系方式：QQ <span class="qq">2235894707</span>
    </div>
    <p>本篇帖子涵盖了六(2)全体同学的名单，包含转学或所有新来的同学，包含大家担任的职位，其中蓝色的字体可以点开查看详细信息，该名单按座号顺序排列：</p>
    <div class="student-list" id="studentList">
      <div class="loading-box">
        <div class="main-text">⏳ 加载中...</div>
        <div class="sub-text">如果长时间未加载，请尝试刷新页面或检查网络连接</div>
        <div class="link-text">
          如仍无法加载，可点击此按钮下载 <a href="javascript:void(0)" onclick="downloadTxt()">同学录文档版</a> 进行查看！
        </div>
      </div>
    </div>

    <div class="back" style="margin-top: 30px;">
      <a href="https://aiyou945.github.io/602/">返回首页</a>
      <br />
      <a href="https://supabase.com/dashboard/project/vrmxttqpaaodgqjlwfwq">supabase跳转</a>
    </div>
  </div>
</div>

<script>
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  document.addEventListener('keydown', function(e) {
    if(e.key === 'F12' || (e.ctrlKey && e.key === 'u') || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J'))){
      e.preventDefault();
      return false;
    }
  });
  (function checkLogin(){
    let logined = sessionStorage.getItem('logined');
    if(!logined){
      sessionStorage.setItem('backUrl', location.href);
      location.href = '/602/login.html';
    }
  })();

  function downloadTxt() {
    var link = document.createElement('a');
    link.href = '/602/member/602.txt';
    link.download = '602.txt';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>
<script src="/602/member/loading.js"></script>
</body>
</html>
