<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班级故事 - 西峰小学2020级2班</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", "PingFang SC", -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f0f4fa 0%, #d9e2ef 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .container {
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      padding: 40px 30px 30px;
      background: rgba(255, 255, 255, 0.70);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(44, 82, 130, 0.10);
      margin-bottom: 28px;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .header h1 {
      font-size: 2.6rem;
      font-weight: 700;
      background: linear-gradient(145deg, #1f3a6b, #b8860b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 2px;
      margin-bottom: 6px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .header p {
      font-size: 1.2rem;
      color: #4a5b6e;
      letter-spacing: 6px;
      font-weight: 300;
      border-top: 2px solid #d4c5a6;
      display: inline-block;
      padding-top: 10px;
      padding-left: 12px;
      padding-right: 12px;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 8px;
      padding: 32px 34px;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(44, 82, 130, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .story-title {
      font-size: 1.8rem;
      font-weight: 600;
      color: #1f3a5f;
      border-left: 6px solid #d4af37;
      padding-left: 16px;
      margin-bottom: 12px;
    }

    .story-meta {
      font-size: 0.9rem;
      color: #7a8a9e;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e8edf5;
      padding-left: 22px;
    }

    .story-content {
      font-size: 1.05rem;
      line-height: 1.9;
      color: #2d3a4b;
      margin-bottom: 24px;
    }

    .story-content p {
      margin-bottom: 14px;
    }

    .nav-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      padding-top: 16px;
      border-top: 1px solid #e8edf5;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #1f3a6b;
      color: white;
      padding: 10px 24px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(31, 58, 107, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
    }

    .btn:hover {
      background: #0f2a50;
      transform: scale(1.03);
      box-shadow: 0 8px 20px rgba(31, 58, 107, 0.35);
    }

    .btn-outline {
      background: transparent;
      color: #1f3a6b;
      border: 2px solid #1f3a6b;
      box-shadow: none;
    }

    .btn-outline:hover {
      background: #1f3a6b;
      color: white;
    }

    .btn-disabled {
      background: #b0b8c5 !important;
      color: #fff !important;
      cursor: not-allowed !important;
      box-shadow: none !important;
      pointer-events: none !important;
      opacity: 0.6 !important;
    }

    .nav-info {
      font-size: 0.9rem;
      color: #5f6b7a;
      text-align: center;
    }

    .back-home {
      text-align: center;
      margin-top: 20px;
    }

    .loading-box {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    .loading-box .main-text {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }
    .loading-box .sub-text {
      font-size: 0.9rem;
      color: #bbb;
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 2.0rem;
      }
      .card {
        padding: 24px 18px;
      }
      .story-title {
        font-size: 1.4rem;
      }
      .nav-area {
        flex-direction: column;
        gap: 12px;
      }
      .btn {
        width: 100%;
        padding: 10px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>2020级2班同学回忆册</h1>
    <p>📖 班级故事</p>
  </div>

  <div class="card" id="storyCard">
    <div id="storyContent">
      <div class="loading-box">
        <div class="main-text">⏳ 加载中...</div>
        <div class="sub-text">正在获取故事内容</div>
      </div>
    </div>
  </div>

  <div class="back-home">
    <a href="/602/" class="btn btn-outline">🏠 返回首页</a>
  </div>
</div>

<script>
  // ---------- Supabase 配置 ----------
  var SUPABASE_URL = 'https://vrmxttqpaaodgqjlwfwq.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_IZEstYDnwdE2-EonDD_uhg_rhq314BL';

  // ---------- 获取当前故事 ID ----------
  function getStoryId() {
    var params = new URLSearchParams(window.location.search);
    var id = parseInt(params.get('id'), 10);
    return isNaN(id) ? 1 : id;
  }

  // ---------- 从 Supabase 加载所有故事 ----------
  function loadStories(callback) {
    fetch(SUPABASE_URL + '/rest/v1/stories?select=*&order=id.asc', {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json'
      }
    })
    .then(function(res) {
      if (!res.ok) throw new Error('网络请求失败');
      return res.json();
    })
    .then(function(data) {
      callback(null, data);
    })
    .catch(function(err) {
      callback(err, null);
    });
  }

  // ---------- 渲染故事 ----------
  function renderStory(stories, id) {
    var container = document.getElementById('storyContent');

    if (!stories || stories.length === 0) {
      container.innerHTML = `
        <div style="text-align:center;padding:40px;color:#999;">
          <p style="font-size:1.2rem;">📭 暂无故事</p>
          <p style="margin-top:12px;">管理员正在准备内容，请稍后再来</p>
        </div>
      `;
      return;
    }

    var story = stories.find(function(s) { return s.id === id; });

    if (!story) {
      container.innerHTML = `
        <div style="text-align:center;padding:40px;color:#999;">
          <p style="font-size:1.2rem;">📭 故事不存在</p>
          <p style="margin-top:12px;">请返回首页查看其他故事</p>
        </div>
      `;
      return;
    }

    // 找上一篇下一篇
    var prevId = null;
    var nextId = null;
    var prevTitle = '';
    var nextTitle = '';
    for (var i = 0; i < stories.length; i++) {
      if (stories[i].id === id) {
        if (i > 0) {
          prevId = stories[i - 1].id;
          prevTitle = stories[i - 1].title;
        }
        if (i < stories.length - 1) {
          nextId = stories[i + 1].id;
          nextTitle = stories[i + 1].title;
        }
        break;
      }
    }

    var html = `
      <div class="story-title">${story.title}</div>
      <div class="story-meta">📅 ${story.date || '日期不详'}</div>
      <div class="story-content">${story.content}</div>
      <div class="nav-area">
    `;

    if (prevId !== null) {
      html += `<a href="?id=${prevId}" class="btn btn-outline">⬅ 上一篇：${prevTitle}</a>`;
    } else {
      html += `<span class="btn btn-disabled">⬅ 已是第一篇</span>`;
    }

    html += `<span class="nav-info">📖 ${id} / ${stories.length}</span>`;

    if (nextId !== null) {
      html += `<a href="?id=${nextId}" class="btn btn-outline">下一篇：${nextTitle} ➡</a>`;
    } else {
      html += `<span class="btn btn-disabled">已是最后一篇 ➡</span>`;
    }
    html += '</div>';

    container.innerHTML = html;
  }

  // ---------- 初始化 ----------
  var storyId = getStoryId();

  loadStories(function(err, stories) {
    if (err) {
      document.getElementById('storyContent').innerHTML = `
        <div style="text-align:center;padding:40px;color:#c0392b;">
          <p style="font-size:1.2rem;">❌ 加载失败</p>
          <p style="margin-top:12px;">请检查网络连接后刷新重试</p>
        </div>
      `;
      return;
    }
    renderStory(stories, storyId);
  });

  // ---------- 反调试 ----------
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' ||
        (e.ctrlKey && e.key === 'u') ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J'))) {
      e.preventDefault();
      return false;
    }
  });
</script>
</body>
</html>
